<!doctype html>
<html lang="id" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D5F3F" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Title & Basic Meta -->
    <title>UMKM Cerme</title>
    <meta name="title" content="UMKM Cerme" />
    <meta
      name="description"
      content="Katalog Usaha Lokal Desa Cerme"
    />

    <!-- Schema.org / Google / WhatsApp Fallback -->
    <meta itemprop="name" content="UMKM Cerme" />
    <meta itemprop="description" content="Katalog Usaha Lokal Desa Cerme" />
    <meta itemprop="image" content="https://umkmcerme.vercel.app/logo-preview.png" />
    <link rel="image_src" href="https://umkmcerme.vercel.app/logo-preview.png" />

    <!-- Open Graph / WhatsApp / Facebook (Square Card Format like LOKALOKE) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkmcerme.vercel.app/" />
    <meta property="og:site_name" content="UMKM Cerme" />
    <meta property="og:title" content="UMKM Cerme" />
    <meta property="og:description" content="Katalog Usaha Lokal Desa Cerme" />
    <meta property="og:image" content="https://umkmcerme.vercel.app/logo-preview.png" />
    <meta property="og:image:secure_url" content="https://umkmcerme.vercel.app/logo-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter (Summary format for square logo preview) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://umkmcerme.vercel.app/" />
    <meta name="twitter:title" content="UMKM Cerme" />
    <meta name="twitter:description" content="Katalog Usaha Lokal Desa Cerme" />
    <meta name="twitter:image" content="https://umkmcerme.vercel.app/logo-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
